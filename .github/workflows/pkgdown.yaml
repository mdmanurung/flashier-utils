# Build follows r-lib/actions' pkgdown example; publication uses GitHub Pages artifacts.
name: pkgdown
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pkgdown-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-pandoc@v2
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - name: Install GSL for mashr
        run: sudo apt-get update && sudo apt-get install -y libgsl-dev
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          dependencies: '"all"'
          extra-packages: any::pkgdown, local::.
          needs: website
      - name: Prepare published pancreas example data
        # Explicit download of upstream single-cell Jamboree data; not part of the package.
        run: |
          mkdir -p "$RUNNER_TEMP/pancreas"
          FLASHIER_UTILS_PANCREAS_DIR="$RUNNER_TEMP/pancreas" Rscript .github/scripts/prepare-pancreas.R
          echo "FLASHIER_UTILS_PANCREAS_DIR=$RUNNER_TEMP/pancreas" >> "$GITHUB_ENV"
      - name: Build documentation
        shell: Rscript {0}
        run: |
          # Exclude repository instructions from the public site in this CI checkout.
          file.remove("AGENTS.md")
          pkgdown::build_site_github_pages(new_process = FALSE, install = FALSE)
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish documentation
        id: deployment
        uses: actions/deploy-pages@v4
