# Reverse-dependency check: verify the downstream cellprograms package against
# changes to flashier-utils. Runs on PRs and weekly; uses small fixtures only
# (no large scientific datasets).
on:
  pull_request:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

name: revdep-cellprograms

permissions: read-all

jobs:
  revdep:
    runs-on: ubuntu-latest
    name: cellprograms against this flashier-utils
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true

      # any::remotes is needed by the explicit install steps below; it is not
      # pulled in by needs: check.
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck, any::remotes
          needs: check

      # Install the downstream package first: its Remotes field pulls
      # flashier-utils from the pinned ref. The PR head is force-installed
      # last so it is what the tests actually exercise.
      - name: Install cellprograms (sync/stage-a branch)
        shell: Rscript {0}
        run: remotes::install_github("mdmanurung/cellprograms@sync/stage-a", upgrade = "never")

      - name: Install this flashier-utils
        shell: Rscript {0}
        run: remotes::install_local(".", upgrade = "never", force = TRUE)

      - name: Run cellprograms sync + core tests against this flashier-utils
        shell: Rscript {0}
        run: |
          library(cellprograms)
          # the synchronization parity tests are the contract under test
          testthat::test_package("cellprograms", reporter = "summary",
                                 filter = "sync|ebmf|covariates|extract-stability")
