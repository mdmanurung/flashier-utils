articles:
  - title: Fit and extract factors
    desc: Fit a matrix, extract matching activity and feature-effect matrices, and retain their scales and measurement units.
    contents:
      - first-fit
      - representation-units
      - edit-fits
  - title: Identify features and pathways
    desc: Rank the features that define each factor and annotate feature programs with gene sets or signed networks.
    contents:
      - largest-distinctive
      - enrichment
      - program-annotation
      - pancreas-programs
  - title: Compare groups and conditions
    desc: Summarize group differences, test metadata associations, translate contrasts into feature effects, and shrink comparable effects across conditions.
    contents:
      - contrasts
      - backprojection
      - multi-cohort
  - title: Assess uncertainty, stability and prediction
    desc: Examine posterior uncertainty, assess factor recovery and replication, and evaluate held-out reconstruction or masked-feature prediction.
    contents:
      - uncertainty
      - stability-replicability
      - holdout
      - program-diagnostics
      - dataset-transfer
  - title: Visualize single-cell factors
    desc: Store activities in Seurat, compute a factor embedding, and display activities or reference-cell percentiles.
    contents:
      - single-cell
      - protein-interpretation
  - title: Find sources and cite methods
    desc: Identify original authors, trace function origins, and record method citations and dependency versions.
    contents:
      - credits
      - provenance
